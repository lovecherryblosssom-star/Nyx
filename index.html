<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script & Stanza | Digital Archive</title>

    <!-- Google Fonts: Fleur De Leah, Lavishly Yours, Hurricane, Allura -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Fleur+De+Leah&family=Hurricane&family=Lavishly+Yours&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #f7f3fa;
            --card-bg: rgba(255, 255, 255, 0.1);
            --lavender: #9b8fba;
            --blue: #7ba7c7;
            --text: #3a2e4a;
            --parchment: #b08968;
            --glow: rgba(179, 166, 211, 0.3);
            --pink-glow: #e0d4f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Allura', cursive;
            font-size: 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #weather-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .flower-img {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .flower-img img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        /* petal shapes (fallback) */
        .petal-rose {
            width: 18px;
            height: 18px;
            background: #e57373;
            border-radius: 60% 40% 50% 50%;
            box-shadow: 0 0 8px #ffb3b3;
        }

        .petal-sakura {
            width: 16px;
            height: 16px;
            background: #ffc1e3;
            border-radius: 50% 0 50% 0;
            box-shadow: 0 0 6px #ffe4f0;
        }

        .petal-lotus {
            width: 18px;
            height: 22px;
            background: #f8bbd0;
            border-radius: 50% 50% 10% 10%;
            box-shadow: 0 0 10px #fce4ec;
        }

        .petal-marigold {
            width: 18px;
            height: 18px;
            background: #ffb74d;
            border-radius: 70% 30% 60% 40%;
            box-shadow: 0 0 12px #ffe082;
        }

        .petal-lavender {
            width: 10px;
            height: 18px;
            background: #b39ddb;
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 0 6px #d1c4e9;
        }

        .petal-bluebell {
            width: 14px;
            height: 16px;
            background: #90caf9;
            border-radius: 60% 60% 30% 30%;
            box-shadow: 0 0 6px #bbdefb;
        }

        .petal-wisteria {
            width: 12px;
            height: 22px;
            background: #c5a3d9;
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 0 8px #e1d0f0;
        }

        .petal-jasmine {
            width: 12px;
            height: 12px;
            background: #fdf5e6;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff8dc;
        }

        .petal-babysbreath {
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 10px #f0f0ff;
        }

        .petal-rumex {
            width: 6px;
            height: 22px;
            background: #a0522d;
            border-radius: 30% 70% 20% 80%;
            box-shadow: 0 0 6px #cd853f;
        }

        .petal-whitemeadow {
            width: 14px;
            height: 14px;
            background: #f5f0e6;
            border-radius: 70% 30% 70% 30%;
            box-shadow: 0 0 15px #fff8f0;
        }

        .petal-sorrel {
            width: 6px;
            height: 22px;
            background: #a0522d;
            border-radius: 30% 70% 20% 80%;
            box-shadow: 0 0 6px #cd853f;
        }

        .petal-larch {
            width: 10px;
            height: 14px;
            background: #c2a144;
            border-radius: 20% 80% 30% 70%;
            box-shadow: 0 0 6px #e6c873;
        }

        .petal-buttercup {
            width: 16px;
            height: 14px;
            background: #fdd835;
            border-radius: 60% 40% 50% 50%;
            box-shadow: 0 0 12px #ffee58;
        }

        .petal-clematis {
            width: 18px;
            height: 18px;
            background: #ba9fcf;
            border-radius: 0% 100% 0% 100%;
            box-shadow: 0 0 10px #d9c2e6;
        }

        .petal-spirea {
            width: 14px;
            height: 14px;
            background: #f5f0e6;
            border-radius: 70% 30% 70% 30%;
            box-shadow: 0 0 15px #fff8f0;
        }

        .petal-carolina {
            width: 16px;
            height: 18px;
            background: #6b3a3a;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 10px #a0522d;
        }

        .petal-tigerlily {
            width: 20px;
            height: 24px;
            background: #ff8c00;
            border-radius: 30% 70% 40% 60%;
            box-shadow: 0 0 14px #ffa500;
        }

        .rain-drop {
            width: 2px;
            height: 55px;
            background: linear-gradient(to bottom, transparent, #7ba7c7);
            opacity: 0.85;
            box-shadow: 0 0 6px #a8d0e6;
            border-radius: 2px;
        }

        .snowflake {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            filter: blur(0.5px);
            box-shadow: 0 0 5px #ffffff;
            opacity: 0.85;
        }

        /* layout */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Fleur De Leah', cursive;
            color: var(--lavender);
            letter-spacing: 6px;
            font-size: 2.9rem;
            font-weight: 400;
            text-shadow: 0 0 15px var(--pink-glow), 0 0 30px var(--pink-glow);
        }

        .subtitle {
            font-family: 'Fleur De Leah', cursive;
            font-style: italic;
            opacity: 0.9;
            color: var(--blue);
            font-size: 2.1rem;
            text-shadow: 0 0 10px var(--pink-glow);
        }

        nav {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            position: relative;
        }

        nav button {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--lavender);
            color: var(--lavender);
            padding: 10px 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.6rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            font-weight: bold;
            transition: 0.3s;
            font-family: 'Lavishly Yours', cursive;
            text-shadow: 0 0 8px var(--pink-glow);
        }

        nav button:hover,
        nav button.active {
            background: var(--lavender);
            color: white;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        .index-toggle {
            background: none;
            border: none;
            color: var(--blue);
            cursor: pointer;
            text-decoration: underline;
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 10px;
            z-index: 10;
            position: relative;
            display: block;
            text-align: center;
            width: 100%;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            text-underline-offset: 4px;
            text-shadow: 0 0 6px var(--pink-glow);
        }

        .index-toggle:hover {
            color: var(--lavender) !important;
            text-shadow: 0 0 8px var(--glow);
        }

        /* Styling for main and sub-toggles */
        .index-toggle,
        .sub-toggle {
            color: var(--blue);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            display: inline-block;
            /* Required for transform/spacing transitions */
            letter-spacing: 0px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Hover state: slight text expansion + soft glow */
        .index-toggle:hover,
        .sub-toggle:hover {
            color: var(--lavender) !important;
            letter-spacing: 1.5px;
            /* Text expands slightly */
            text-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow);
            /* Soft light glow */
        }

        /* Active sub-toggle highlight */
        .sub-toggle.active {
            color: var(--lavender) !important;
            font-weight: bold;
            text-shadow: 0 0 8px var(--glow);
        }

        .nav-separator {
            color: var(--blue);
            opacity: 0.5;
            margin: 0 10px;
        }

        .commercial-text strong {
            color: #f5a7d3;
            font-weight: bold;
        }

        .novel-genre {
            color: #888;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .novel-tropes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        #poem-index {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px auto 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid var(--glow);
            width: 90%;
            max-width: 700px;
            z-index: 10;
            position: relative;
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
        }

        .index-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 6px 0;
            transition: 0.3s;
        }

        .index-item:hover .index-title {
            opacity: 1;
            color: var(--lavender);
            padding-left: 5px;
        }

        .index-heart {
            color: var(--lavender);
            margin-right: 12px;
            font-size: 1.6rem;
            text-shadow: 0 0 5px var(--pink-glow);
            transition: color 0.3s, text-shadow 0.3s;
        }

        .index-heart:hover {
            color: #d5cfe6;
            text-shadow: 0 0 12px var(--pink-glow), 0 0 20px var(--pink-glow);
        }

        .index-title {
            font-size: 1.4rem;
            opacity: 0.85;
        }

        #display-container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 50px;
            min-height: 400px;
            z-index: 5;
            position: relative;
        }

        .meta-tag {
            font-family: 'Hurricane', cursive;
            font-size: 2rem;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 0 7px var(--pink-glow);
        }

        .poem-title {
            font-family: 'Fleur De Leah', cursive;
            color: var(--blue);
            font-size: 2.7rem;
            margin-bottom: 20px;
            font-style: italic;
            text-shadow: 0 0 15px var(--pink-glow);
        }

        .poem-body {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 1.7rem;
            margin-bottom: 30px;
            font-family: 'Allura', cursive;
        }

        .poem-signature {
            font-family: 'Fleur De Leah', cursive;
            text-align: right;
            font-style: italic;
            color: var(--lavender);
            margin-top: 20px;
            border-top: 1px dashed var(--glow);
            padding-top: 20px;
            font-size: 1.8rem;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        .novel-title {
            font-family: 'Fleur De Leah', cursive;
            color: var(--parchment);
            font-size: 2.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glow);
            padding-bottom: 10px;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        #inner-view p {
            font-family: 'Allura', cursive;
            font-size: 2rem;
            line-height: 1.9;
        }

        .action-btn {
            background: var(--lavender);
            color: white;
            border: none;
            padding: 10px 25px;
            margin: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 40px;
            transition: 0.3s;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--pink-glow);
        }

        .action-btn:hover {
            background: #8a7eab;
        }

        .pearls-compose {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        #pearl-input {
            width: 100%;
            min-height: 90px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--glow);
            background: rgba(255, 255, 255, 0.5);
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
            color: var(--text);
            resize: vertical;
        }

        #pearl-input:focus {
            outline: none;
            border-color: var(--lavender);
        }

        .pearls-status {
            text-align: center;
            color: var(--blue);
            font-style: italic;
            opacity: 0.8;
            padding: 30px 0;
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
        }

        .pearl-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 0;
            border-top: 1px dashed var(--glow);
        }

        .pearl-item:first-child {
            border-top: none;
        }

        .pearl-item.editing {
            flex-direction: column;
            align-items: stretch;
        }

        .pearl-item.editing .pearl-actions {
            justify-content: flex-end;
        }

        .pearl-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1.5rem;
            flex: 1;
            font-family: 'Allura', cursive;
        }

        .pearl-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .pearl-icon-btn {
            background: none;
            border: none;
            color: var(--lavender);
            cursor: pointer;
            font-size: 1.5rem;
            opacity: 0.7;
            transition: 0.3s;
            padding: 2px 4px;
        }

        .pearl-icon-btn:hover {
            opacity: 1;
        }

        .pearl-edit-input {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--lavender);
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
            color: var(--text);
            resize: vertical;
        }

        /* Commercial headings (brand names, piece names) */
        #display-container h3 {
            font-family: 'Lavishly Yours', cursive;
            font-size: 2.9rem;
            text-shadow: 0 0 8px var(--pink-glow);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .commercial-quote {
            color: #f5a7d3;
            /* same pink as the bold words */
        }

        #display-container strong {
            font-family: 'Lavishly Yours', cursive;
            font-size: 2.2rem;
            display: block;
            margin-bottom: 10px;
            color: var(--lavender);
            text-shadow: 0 0 8px var(--pink-glow);
            letter-spacing: 0.5px;
        }

        #display-container .commercial-text strong {
            color: #f5a7d3;
            /* your chosen pink – change as you like */
            font-weight: bold;
        }

        .action-btn.active-tab {
            border-color: var(--lavender);
            color: var(--lavender);
            box-shadow: 0 0 10px var(--glow);
        }

        /* Descriptive paragraphs inside commercial copy */
        .commercial-paragraph {
            font-size: 2rem;
            line-height: 1.9;
        }

        /* Copy button + toast styles */
        .copy-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--lavender);
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.1rem;
            margin-left: 10px;
            transition: 0.18s ease;
        }

        .copy-btn:hover {
            background: var(--lavender);
            color: #fff;
            transform: translateY(-1px);
        }

        .copy-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: var(--lavender);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
            opacity: 0;
            transform: translateY(10px);
            transition: 0.25s ease;
            z-index: 9999;
            pointer-events: none;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>

    <script>
        /*
         * Copy-to-clipboard utility
         * - Auto-attaches copy buttons next to elements matching these selectors:
         *   .pearl-content, .poem-body, .novel-description, .commercial-paragraph
         * - Observes DOM mutations so dynamically-rendered content (from poems.js etc.) will get buttons.
         * - Exposes window.addCopyButtonTo(selectorOrElement) to attach to specific elements programmatically.
         */
        (function () {
            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                // fallback
                return new Promise(function (resolve, reject) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.left = '-9999px';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        resolve();
                    } catch (err) {
                        reject(err);
                    }
                });
            }

            function showToast(msg) {
                let toast = document.getElementById('copy-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'copy-toast';
                    toast.className = 'copy-toast';
                    document.body.appendChild(toast);
                }
                toast.textContent = msg || 'Copied';
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(function () {
                    toast.classList.remove('show');
                }, 1400);
            }

            function attachButtonTo(el) {
                if (!el || el.dataset.copyAttached) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.type = 'button';
                btn.title = 'Copy';
                btn.innerText = 'Copy';

                btn.addEventListener('click', function (ev) {
                    ev.stopPropagation();
                    const text = (el.innerText || el.textContent || '').trim();
                    if (!text) {
                        showToast('Nothing to copy');
                        return;
                    }
                    copyText(text).then(function () {
                        showToast('Copied');
                    }).catch(function () {
                        showToast('Copy failed');
                    });
                });

                // Place the button after the element. If the element is block-level, keep the button inline.
                el.parentNode.insertBefore(btn, el.nextSibling);
                el.dataset.copyAttached = '1';
            }

            function addCopyButtonsFor(selector) {
                try {
                    document.querySelectorAll(selector).forEach(attachButtonTo);
                } catch (e) {
                    // selector might be invalid or no document available yet
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                // initial pass for common selectors
                addCopyButtonsFor('.pearl-content');
                addCopyButtonsFor('.poem-body');
                addCopyButtonsFor('.novel-description');
                addCopyButtonsFor('.commercial-paragraph');

                // observe for dynamic additions (poems.js, commercial.js, or other scripts may render later)
                const obs = new MutationObserver(function (mutations) {
                    for (const m of mutations) {
                        if (m.addedNodes && m.addedNodes.length) {
                            addCopyButtonsFor('.pearl-content');
                            addCopyButtonsFor('.poem-body');
                            addCopyButtonsFor('.novel-description');
                            addCopyButtonsFor('.commercial-paragraph');
                        }
                    }
                });
                obs.observe(document.body, { childList: true, subtree: true });
            });

            // Expose helper so other scripts can programmatically add copy buttons after rendering
            window.addCopyButtonTo = function (selectorOrElement) {
                if (!selectorOrElement) return;
                if (typeof selectorOrElement === 'string') {
                    document.querySelectorAll(selectorOrElement).forEach(attachButtonTo);
                } else if (selectorOrElement instanceof Element) {
                    attachButtonTo(selectorOrElement);
                }
            };
        })();
    </script>
