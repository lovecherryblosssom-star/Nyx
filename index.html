<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Script & Stanza | Digital Archive</title>

    <!-- Google Fonts: Fleur De Leah, Lavishly Yours, Hurricane, Allura -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Fleur+De+Leah&family=Hurricane&family=Lavishly+Yours&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #f7f3fa;
            --card-bg: rgba(255, 255, 255, 0.1);
            --lavender: #9b8fba;
            --blue: #7ba7c7;
            --text: #3a2e4a;
            --parchment: #b08968;
            --glow: rgba(179, 166, 211, 0.3);
            --pink-glow: #e0d4f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Allura', cursive;
            font-size: 1.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #weather-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            top: -50px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        .flower-img {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .flower-img img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        /* petal shapes (fallback) */
        .petal-rose {
            width: 18px;
            height: 18px;
            background: #e57373;
            border-radius: 60% 40% 50% 50%;
            box-shadow: 0 0 8px #ffb3b3;
        }

        .petal-sakura {
            width: 16px;
            height: 16px;
            background: #ffc1e3;
            border-radius: 50% 0 50% 0;
            box-shadow: 0 0 6px #ffe4f0;
        }

        .petal-lotus {
            width: 18px;
            height: 22px;
            background: #f8bbd0;
            border-radius: 50% 50% 10% 10%;
            box-shadow: 0 0 10px #fce4ec;
        }

        .petal-marigold {
            width: 18px;
            height: 18px;
            background: #ffb74d;
            border-radius: 70% 30% 60% 40%;
            box-shadow: 0 0 12px #ffe082;
        }

        .petal-lavender {
            width: 10px;
            height: 18px;
            background: #b39ddb;
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 0 6px #d1c4e9;
        }

        .petal-bluebell {
            width: 14px;
            height: 16px;
            background: #90caf9;
            border-radius: 60% 60% 30% 30%;
            box-shadow: 0 0 6px #bbdefb;
        }

        .petal-wisteria {
            width: 12px;
            height: 22px;
            background: #c5a3d9;
            border-radius: 50% 50% 30% 30%;
            box-shadow: 0 0 8px #e1d0f0;
        }

        .petal-jasmine {
            width: 12px;
            height: 12px;
            background: #fdf5e6;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff8dc;
        }

        .petal-babysbreath {
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 10px #f0f0ff;
        }

        .petal-rumex {
            width: 6px;
            height: 22px;
            background: #a0522d;
            border-radius: 30% 70% 20% 80%;
            box-shadow: 0 0 6px #cd853f;
        }

        .petal-whitemeadow {
            width: 14px;
            height: 14px;
            background: #f5f0e6;
            border-radius: 70% 30% 70% 30%;
            box-shadow: 0 0 15px #fff8f0;
        }

        .petal-sorrel {
            width: 6px;
            height: 22px;
            background: #a0522d;
            border-radius: 30% 70% 20% 80%;
            box-shadow: 0 0 6px #cd853f;
        }

        .petal-larch {
            width: 10px;
            height: 14px;
            background: #c2a144;
            border-radius: 20% 80% 30% 70%;
            box-shadow: 0 0 6px #e6c873;
        }

        .petal-buttercup {
            width: 16px;
            height: 14px;
            background: #fdd835;
            border-radius: 60% 40% 50% 50%;
            box-shadow: 0 0 12px #ffee58;
        }

        .petal-clematis {
            width: 18px;
            height: 18px;
            background: #ba9fcf;
            border-radius: 0% 100% 0% 100%;
            box-shadow: 0 0 10px #d9c2e6;
        }

        .petal-spirea {
            width: 14px;
            height: 14px;
            background: #f5f0e6;
            border-radius: 70% 30% 70% 30%;
            box-shadow: 0 0 15px #fff8f0;
        }

        .petal-carolina {
            width: 16px;
            height: 18px;
            background: #6b3a3a;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 10px #a0522d;
        }

        .petal-tigerlily {
            width: 20px;
            height: 24px;
            background: #ff8c00;
            border-radius: 30% 70% 40% 60%;
            box-shadow: 0 0 14px #ffa500;
        }

        .rain-drop {
            width: 2px;
            height: 55px;
            background: linear-gradient(to bottom, transparent, #7ba7c7);
            opacity: 0.85;
            box-shadow: 0 0 6px #a8d0e6;
            border-radius: 2px;
        }

        .snowflake {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            filter: blur(0.5px);
            box-shadow: 0 0 5px #ffffff;
            opacity: 0.85;
        }

        /* layout */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Fleur De Leah', cursive;
            color: var(--lavender);
            letter-spacing: 6px;
            font-size: 2.9rem;
            font-weight: 400;
            text-shadow: 0 0 15px var(--pink-glow), 0 0 30px var(--pink-glow);
        }

        .subtitle {
            font-family: 'Fleur De Leah', cursive;
            font-style: italic;
            opacity: 0.9;
            color: var(--blue);
            font-size: 2.1rem;
            text-shadow: 0 0 10px var(--pink-glow);
        }

        nav {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            position: relative;
        }

        nav button {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--lavender);
            color: var(--lavender);
            padding: 10px 25px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.6rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            font-weight: bold;
            transition: 0.3s;
            font-family: 'Lavishly Yours', cursive;
            text-shadow: 0 0 8px var(--pink-glow);
        }

        nav button:hover,
        nav button.active {
            background: var(--lavender);
            color: white;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        .index-toggle {
            background: none;
            border: none;
            color: var(--blue);
            cursor: pointer;
            text-decoration: underline;
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 10px;
            z-index: 10;
            position: relative;
            display: block;
            text-align: center;
            width: 100%;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            text-underline-offset: 4px;
            text-shadow: 0 0 6px var(--pink-glow);
        }

        .index-toggle:hover {
            color: var(--lavender) !important;
            text-shadow: 0 0 8px var(--glow);
        }

        /* Styling for main and sub-toggles */
        .index-toggle,
        .sub-toggle {
            color: var(--blue);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            display: inline-block;
            letter-spacing: 0px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .index-toggle:hover,
        .sub-toggle:hover {
            color: var(--lavender) !important;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow);
        }

        .sub-toggle.active {
            color: var(--lavender) !important;
            font-weight: bold;
            text-shadow: 0 0 8px var(--glow);
        }

        .nav-separator {
            color: var(--blue);
            opacity: 0.5;
            margin: 0 10px;
        }

        .commercial-text strong {
            color: #f5a7d3;
            font-weight: bold;
        }

        .novel-genre {
            color: #888;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .novel-tropes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        #poem-index {
            display: none;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px auto 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid var(--glow);
            width: 90%;
            max-width: 700px;
            z-index: 10;
            position: relative;
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
        }

        .index-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 6px 0;
            transition: 0.3s;
        }

        .index-item:hover .index-title {
            opacity: 1;
            color: var(--lavender);
            padding-left: 5px;
        }

        .index-heart {
            color: var(--lavender);
            margin-right: 12px;
            font-size: 1.6rem;
            text-shadow: 0 0 5px var(--pink-glow);
            transition: color 0.3s, text-shadow 0.3s;
        }

        .index-heart:hover {
            color: #d5cfe6;
            text-shadow: 0 0 12px var(--pink-glow), 0 0 20px var(--pink-glow);
        }

        .index-title {
            font-size: 1.4rem;
            opacity: 0.85;
        }

        #display-container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 50px;
            min-height: 400px;
            z-index: 5;
            position: relative;
        }

        .meta-tag {
            font-family: 'Hurricane', cursive;
            font-size: 2rem;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 0 7px var(--pink-glow);
        }

        .poem-title {
            font-family: 'Fleur De Leah', cursive;
            color: var(--blue);
            font-size: 2.7rem;
            margin-bottom: 20px;
            font-style: italic;
            text-shadow: 0 0 15px var(--pink-glow);
        }

        .poem-body {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 1.7rem;
            margin-bottom: 30px;
            font-family: 'Allura', cursive;
        }

        .poem-signature {
            font-family: 'Fleur De Leah', cursive;
            text-align: right;
            font-style: italic;
            color: var(--lavender);
            margin-top: 20px;
            border-top: 1px dashed var(--glow);
            padding-top: 20px;
            font-size: 1.8rem;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        .novel-title {
            font-family: 'Fleur De Leah', cursive;
            color: var(--parchment);
            font-size: 2.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glow);
            padding-bottom: 10px;
            text-shadow: 0 0 12px var(--pink-glow);
        }

        #inner-view p {
            font-family: 'Allura', cursive;
            font-size: 2rem;
            line-height: 1.9;
        }

        .action-btn {
            background: var(--lavender);
            color: white;
            border: none;
            padding: 10px 25px;
            margin: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 40px;
            transition: 0.3s;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--pink-glow);
        }

        .action-btn:hover {
            background: #8a7eab;
        }

        .pearls-compose {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        #pearl-input {
            width: 100%;
            min-height: 90px;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--glow);
            background: rgba(255, 255, 255, 0.5);
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
            color: var(--text);
            resize: vertical;
        }

        #pearl-input:focus {
            outline: none;
            border-color: var(--lavender);
        }

        .pearls-status {
            text-align: center;
            color: var(--blue);
            font-style: italic;
            opacity: 0.8;
            padding: 30px 0;
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
        }

        .pearl-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 0;
            border-top: 1px dashed var(--glow);
        }

        .pearl-item:first-child {
            border-top: none;
        }

        .pearl-item.editing {
            flex-direction: column;
            align-items: stretch;
        }

        .pearl-item.editing .pearl-actions {
            justify-content: flex-end;
        }

        .pearl-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1.5rem;
            flex: 1;
            font-family: 'Allura', cursive;
        }

        .pearl-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .pearl-icon-btn {
            background: none;
            border: none;
            color: var(--lavender);
            cursor: pointer;
            font-size: 1.5rem;
            opacity: 0.7;
            transition: 0.3s;
            padding: 2px 4px;
        }

        .pearl-icon-btn:hover {
            opacity: 1;
        }

        .pearl-edit-input {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--lavender);
            font-family: 'Allura', cursive;
            font-size: 1.5rem;
            color: var(--text);
            resize: vertical;
        }

        #display-container h3 {
            font-family: 'Lavishly Yours', cursive;
            font-size: 2.9rem;
            text-shadow: 0 0 8px var(--pink-glow);
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .commercial-quote {
            color: #f5a7d3;
        }

        #display-container strong {
            font-family: 'Lavishly Yours', cursive;
            font-size: 2.2rem;
            display: block;
            margin-bottom: 10px;
            color: var(--lavender);
            text-shadow: 0 0 8px var(--pink-glow);
            letter-spacing: 0.5px;
        }

        #display-container .commercial-text strong {
            color: #f5a7d3;
            font-weight: bold;
        }

        .action-btn.active-tab {
            border-color: var(--lavender);
            color: var(--lavender);
            box-shadow: 0 0 10px var(--glow);
        }

        .commercial-paragraph {
            font-size: 2rem;
            line-height: 1.9;
        }

        .copy-whole-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.38);
            border: 1px solid rgba(155, 143, 186, 0.72);
            color: var(--lavender);
            border-radius: 999px;
            padding: 6px 12px;
            margin: 8px 0 0 10px;
            cursor: pointer;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            line-height: 1;
            box-shadow: inset 0 0 0 1px rgba(224, 212, 245, 0.2), 0 0 12px rgba(224, 212, 245, 0.08);
            transition: all 0.2s ease;
            vertical-align: middle;
        }

        .copy-whole-btn::before {
            content: '✧';
            font-size: 0.9em;
            transform: translateY(-1px);
        }

        .copy-whole-btn:hover {
            background: linear-gradient(135deg, var(--lavender), #bba9d7);
            color: #fff;
            border-color: var(--lavender);
            box-shadow: 0 0 16px var(--glow);
            transform: translateY(-1px);
        }

        .copy-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: linear-gradient(135deg, var(--lavender), #b9a8d8);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 24px rgba(94, 67, 118, 0.22);
            opacity: 0;
            transform: translateY(10px);
            transition: 0.25s ease;
            z-index: 9999;
            pointer-events: none;
            font-family: 'Lavishly Yours', cursive;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div id="wisteria-ceiling"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 200px; background-repeat: repeat-x; background-size: contain; z-index: 10;">
    </div>
    <div id="view">
        <div id="weather-container"></div>

        <header>
            <h1>Script & Stanza</h1>
            <div class="subtitle">The Poetic and Narrative Archive of Nyx</div>
        </header>

        <nav>
            <button id="poetry-nav" class="active" onclick="showPoetry()">The Aśk Archive</button>
            <button id="novel-nav" onclick="showNovels()">The Novel Codex</button>
        </nav>

        <div class="index-toggle-container" style="text-align: center; margin-top: 15px;">
            <span id="toggle-index" class="index-toggle">▸ Browse All Titles</span>
            <span class="nav-separator">|</span>
            <span id="copy-nav" class="index-toggle" onclick="showCopywriting()">Archive</span>
            <span class="nav-separator">|</span>
            <span id="pearls-nav" class="index-toggle" onclick="showPearls()">Lotus-Moon Pearls</span>
        </div>
        <div id="poem-index"></div>

        <div id="display-container">
            <div id="inner-view">
                <div style="text-align:center;padding-top:80px;color:var(--blue);">
                    ✦ Digital Archive Online ✦
                </div>
            </div>
        </div>
    </div>
    <script src="poems.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="commercial.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const novels = [
            { id: 1, title: "The Penthouse Wars", genre: "Corporate Romance / Family Drama", tropes: ["Arranged Marriage", "Opposites Attract", "Boardroom Power Play"], description: "A sharp corporate romance between a ruthless CEO and a woman forced back into his orbit." },
            { id: 2, title: "The Quiet Kingdom", genre: "Crime Drama / Family Protection", tropes: ["Underworld Syndicate", "Protective Protagonist", "Found Family"], description: "A gritty crime drama about loyalty, legacy, and the cost of protecting the ones you love." },
            { id: 3, title: "The Kim Inheritance", genre: "Family Saga / High Society", tropes: ["Sisterhood", "Traditional Pressure", "Breaking Legacy"], description: "A poignant family drama tracking the inheritance of old wounds, secrets, and second chances." },
            { id: 4, title: "Peach Blossoms & Fire Crowns", genre: "Dark Romance / Crime Syndicate", tropes: ["Trauma Healing", "Partners in Crime", "Dismantling Corruption"], description: "An atmospheric dark romance where love and vengeance walk the same dangerous line." },
            { id: 5, title: "The Moon Beyond the Abyss", genre: "Urban Fantasy / Supernatural Corporate", tropes: ["Awakened Heritage", "Protective Elite", "Hidden Lore"], description: "A majestic urban fantasy about inherited power, old magic, and a world hiding beneath the everyday." },
            { id: 6, title: "Collateral of the Heart", genre: "Generational Drama / High Society", tropes: ["Arranged Marriage", "Hidden Writings", "Defying Tradition"], description: "A poignant generational drama where love, legacy, and personal truth collide." },
            { id: 7, title: "His Wife", genre: "Contemporary Romance / Slow-Burn", tropes: ["Low-Profile Marriage", "Guarded Husband", "Emotional Healing"], description: "An intimate, slow-burn contemporary romance about trust, tenderness, and choosing each other." },
            { id: 8, title: "The Beauty Under The Petal", genre: "Psychological Thriller / Corporate", tropes: ["Secret Identity", "Protective CEO", "Rival Syndicate"], description: "A psychological thriller about power, masks, and the danger of falling for a man no one can truly know." }
        ];

        let currentView = 'poetry';
        const innerView = document.getElementById('inner-view');
        const poemIndex = document.getElementById('poem-index');
        const toggleIndexBtn = document.getElementById('toggle-index');

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopyToast('Copied to clipboard!');
                }).catch(err => {
                    console.error('Copy failed:', err);
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopyToast('Copied to clipboard!');
        }

        function showCopyToast(message) {
            let toast = document.getElementById('copy-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'copy-toast';
                toast.className = 'copy-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        function createCopyButton(text, label = 'Copy') {
            const btn = document.createElement('button');
            btn.className = 'copy-whole-btn';
            btn.textContent = label;
            btn.onclick = (e) => {
                e.stopPropagation();
                copyToClipboard(text);
            };
            return btn;
        }

        function displayPoem(poemObj) {
            const fullText = `${poemObj.title}\n\n${poemObj.body}\n\n${poemObj.signature}`;
            
            innerView.innerHTML = `
                <span class="meta-tag">poem</span>
                <div class="poem-title">${poemObj.title}</div>
                <div class="poem-body">${poemObj.body}</div>
                <div class="poem-signature">${poemObj.signature}</div>
            `;
            
            const copyBtn = createCopyButton(fullText, '✧ Copy full poem');
            innerView.appendChild(copyBtn);
        }

        function displayNovel(novelObj) {
            const fullText = `${novelObj.title}\n\nGenre: ${novelObj.genre}\n\n${novelObj.description}\n\n— The End`;
            
            let tropesHtml = '';
            if (novelObj.tropes && novelObj.tropes.length > 0) {
                tropesHtml = `<div class="novel-tropes">${novelObj.tropes.map(trope => `<span class="badge">${trope}</span>`).join('')}</div>`;
            }

            innerView.innerHTML = `
                <div class="novel-title">${novelObj.title}</div>
                <div class="novel-genre"><strong>Genre:</strong> ${novelObj.genre}</div>
                ${tropesHtml}
                <p>${novelObj.description}</p>
            `;
            
            const copyBtn = createCopyButton(fullText, '✧ Copy full novel');
            innerView.appendChild(copyBtn);
        }

        function showPoetry() {
            currentView = 'poetry';
            document.getElementById('poetry-nav').classList.add('active');
            document.getElementById('novel-nav').classList.remove('active');
            poemIndex.innerHTML = '';
            poemIndex.style.display = 'none';
            toggleIndexBtn.textContent = '▸ Browse All Titles';
            
            displayPoem(poetryCollection[0]);
            renderPoemIndex();
        }

        function showNovels() {
            currentView = 'novels';
            document.getElementById('novel-nav').classList.add('active');
            document.getElementById('poetry-nav').classList.remove('active');
            poemIndex.innerHTML = '';
            poemIndex.style.display = 'none';
            toggleIndexBtn.textContent = '▸ Browse All Stories';
            
            displayNovel(novels[0]);
            renderNovelIndex();
        }

        function renderPoemIndex() {
            poemIndex.innerHTML = poetryCollection.map(poem => `
                <div class="index-item" onclick="displayPoem(poetryCollection[${poem.id - 1}])">
                    <span class="index-heart">♡</span>
                    <span class="index-title">${poem.title}</span>
                </div>
            `).join('');
        }

        function renderNovelIndex() {
            poemIndex.innerHTML = novels.map((novel, idx) => `
                <div class="index-item" onclick="displayNovel(novels[${idx}])">
                    <span class="index-heart">♡</span>
                    <span class="index-title">${novel.title}</span>
                </div>
            `).join('');
        }

        function toggleIndex() {
            if (poemIndex.style.display === 'none') {
                poemIndex.style.display = 'block';
                toggleIndexBtn.textContent = '▾ Hide All Titles';
            } else {
                poemIndex.style.display = 'none';
                toggleIndexBtn.textContent = currentView === 'poetry' ? '▸ Browse All Titles' : '▸ Browse All Stories';
            }
        }

        toggleIndexBtn.addEventListener('click', toggleIndex);

        showPoetry();

        // Pearls Section
        const pearls = [];

        function showPearls() {
            currentView = 'pearls';
            document.getElementById('poetry-nav').classList.remove('active');
            document.getElementById('novel-nav').classList.remove('active');
            poemIndex.innerHTML = '';
            poemIndex.style.display = 'none';
            toggleIndexBtn.textContent = '▸ Pearls';

            innerView.innerHTML = `
                <div style="text-align: center; margin-bottom: 30px;">
                    <h2 style="font-family: 'Fleur De Leah', cursive; color: var(--blue); font-size: 2.5rem; margin-bottom: 10px;">Lotus-Moon Pearls</h2>
                    <p style="font-family: 'Allura', cursive; color: var(--blue); font-size: 1.4rem; opacity: 0.8;">A sacred collection of fleeting thoughts, whispered truths, and midnight musings.</p>
                </div>
                
                <div class="pearls-compose">
                    <textarea id="pearl-input" placeholder="✧ Write your pearl here..."></textarea>
                    <div style="display: flex; gap: 10px;">
                        <button class="action-btn" onclick="addPearl()">✧ Add Pearl</button>
                        <button class="action-btn" onclick="clearPearls()" style="background: #9b8fba; opacity: 0.7;">Clear All</button>
                    </div>
                </div>
                
                <div id="pearls-container"></div>
            `;

            renderPearls();
        }

        function addPearl() {
            const input = document.getElementById('pearl-input');
            const text = input.value.trim();
            if (text) {
                pearls.push(text);
                input.value = '';
                renderPearls();
            }
        }

        function deletePearl(index) {
            pearls.splice(index, 1);
            renderPearls();
        }

        function editPearl(index) {
            const container = document.getElementById(`pearl-${index}`);
            const content = container.querySelector('.pearl-content');
            const text = content.textContent;

            container.classList.add('editing');
            content.innerHTML = `<textarea class="pearl-edit-input" id="edit-input-${index}">${text}</textarea>`;

            const saveBtn = document.createElement('button');
            saveBtn.className = 'pearl-icon-btn';
            saveBtn.innerHTML = '✓';
            saveBtn.onclick = () => {
                const newText = document.getElementById(`edit-input-${index}`).value;
                pearls[index] = newText;
                renderPearls();
            };

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'pearl-icon-btn';
            cancelBtn.innerHTML = '✕';
            cancelBtn.onclick = () => renderPearls();

            container.querySelector('.pearl-actions').innerHTML = '';
            container.querySelector('.pearl-actions').appendChild(saveBtn);
            container.querySelector('.pearl-actions').appendChild(cancelBtn);
        }

        function renderPearls() {
            const container = document.getElementById('pearls-container');
            if (pearls.length === 0) {
                container.innerHTML = '<div class="pearls-status">✧ No pearls yet. Share your first whisper.</div>';
                return;
            }

            container.innerHTML = pearls.map((pearl, idx) => {
                const fullText = `Lotus-Moon Pearl\n\n${pearl}\n\n— Pearl ${idx + 1}`;
                return `
                    <div class="pearl-item" id="pearl-${idx}">
                        <div class="pearl-content">${pearl}</div>
                        <div class="pearl-actions">
                            <button class="pearl-icon-btn" title="Copy" onclick="copyToClipboard('${pearl.replace(/'/g, "\\'")}'); showCopyToast('Pearl copied!');">✧</button>
                            <button class="pearl-icon-btn" title="Edit" onclick="editPearl(${idx})">✎</button>
                            <button class="pearl-icon-btn" title="Delete" onclick="deletePearl(${idx})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Add copy-full-pearl buttons
            pearls.forEach((pearl, idx) => {
                const fullText = `Lotus-Moon Pearl\n\n${pearl}\n\n— Pearl ${idx + 1}`;
                const item = document.getElementById(`pearl-${idx}`);
                const copyFullBtn = createCopyButton(fullText, '✧ Copy full pearl');
                item.appendChild(copyFullBtn);
            });
        }

        function clearPearls() {
            if (confirm('Are you sure you want to clear all pearls?')) {
                pearls.length = 0;
                renderPearls();
            }
        }

        // Copywriting Section
        function showCopywriting() {
            currentView = 'copywriting';
            document.getElementById('poetry-nav').classList.remove('active');
            document.getElementById('novel-nav').classList.remove('active');
            poemIndex.innerHTML = '';
            poemIndex.style.display = 'none';
            toggleIndexBtn.textContent = '▸ Archive';

            innerView.innerHTML = `
                <h3>✦ The Archive ✦</h3>
                <p style="font-family: 'Allura', cursive; font-size: 1.6rem; line-height: 1.8; color: var(--text);">
                    A collection of <span class="commercial-quote">commercial copywriting</span>, brand narratives, and marketing prose by Vere Keuki. Each piece crafted with intention—balancing persuasion with authenticity.
                </p>
                <p style="font-family: 'Allura', cursive; font-size: 1.6rem; line-height: 1.8; color: var(--text); margin-top: 20px;">
                    These works explore the intersection of <span class="commercial-quote">desire, identity, and brand voice</span>. They are experiments in language—pushing the boundaries of what commercial writing can be.
                </p>
                <p style="font-family: 'Allura', cursive; font-size: 1.6rem; line-height: 1.8; color: var(--text); margin-top: 20px;">
                    (Actual samples coming soon.)
                </p>
            `;
        }
    </script>
</body>

</html>
